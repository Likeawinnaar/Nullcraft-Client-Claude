plugins {
    id "fabric-loom" version "1.7.4"
    id "java"
}

group = "com.nullcraft.client"
version = "1.0.0"
archivesBaseName = "nullcraft-client"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://jitpack.io" }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings "net.fabricmc:yarn:1.21.1+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.14"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.116.0+1.21.1"
    modImplementation "com.google.code.gson:gson:2.11.0"
    modImplementation "org.lwjgl:lwjgl-stb:3.3.4"
    modImplementation "org.lwjgl:lwjgl:3.3.4"
    modImplementation "org.lwjgl:lwjgl-glfw:3.3.4"
    modImplementation "org.lwjgl:lwjgl-opengl:3.3.4"

    include "com.mojang:datafixerupper:7.0.27"
    include "com.mojang:brigadier:1.2.3"
    include "com.mojang:authlib:4.4.12"
    include "org.apache.logging.log4j:log4j-api:2.23.1"
    include "org.apache.logging.log4j:log4j-core:2.23.1"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.0"
    testImplementation "org.mockito:mockito-core:5.14.0"
}

loom {
    accessWidenerPath = file("src/main/resources/nullcraft.accesswidener")
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation" << "-parameters"
}

tasks.named("jar") {
    manifest {
        attributes(
            "Fabric-Mod-ID": "nullcraft",
            "Fabric-Mod-Version": version,
            "Fabric-Mod-Name": "NullCraft Client",
            "Main-Class": "com.nullcraft.client.NullCraftClient",
            "Implementation-Title": "NullCraft Client",
            "Implementation-Version": version,
            "Implementation-Vendor": "NullCraft Team"
        )
    }
    from(sourceSets.main.resources) {
        include "fabric.mod.json"
        include "nullcraft.mixins.json"
        include "assets/**"
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register("downloadFonts") {
    doLast {
        def dest = file("src/main/resources/assets/nullcraft/fonts")
        dest.mkdirs()
        def names = ["Inter-Regular.ttf", "Inter-Medium.ttf", "Inter-SemiBold.ttf", "Inter-Bold.ttf"]
        if (names.any { !new File(dest, it).exists() }) {
            def archive = file("${buildDir}/inter.zip")
            archive.parentFile.mkdirs()
            new URL("https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip").withInputStream { input ->
                archive.withOutputStream { output -> output << input }
            }
            copy {
                from zipTree(archive)
                include "**/Inter-Regular.ttf", "**/Inter-Medium.ttf", "**/Inter-SemiBold.ttf", "**/Inter-Bold.ttf"
                eachFile { path = name }
                includeEmptyDirs = false
                into dest
            }
            if (names.any { !new File(dest, it).exists() }) {
                throw new GradleException("Required Inter fonts missing from archive")
            }
        }
    }
}
tasks.register("generateAssets", JavaExec) {
    dependsOn tasks.named("compileJava")
    mainClass = "com.nullcraft.client.asset.AssetGenerator"
    classpath = files(sourceSets.main.output.classesDirs)
    jvmArgs = ["-Djava.awt.headless=true"]
}
tasks.named("processResources") {
    dependsOn tasks.named("downloadFonts"), tasks.named("generateAssets")
}
tasks.named("test") {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}
